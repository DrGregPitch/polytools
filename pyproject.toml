[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polytools"
version = "0.1.0"
description = "Honest ML infrastructure for polymer property prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["polymer", "cheminformatics", "machine-learning", "materials-informatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rdkit>=2023.9.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gbm = ["lightgbm>=4.0"]
gnn = ["torch>=2.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
# `all` deliberately excludes the heavy torch dependency so base CI stays light
# and the core library installs fast. Install the neural rung with `.[gnn]`.
all = ["polytools[gbm,dev]"]

[project.urls]
Homepage = "https://github.com/DrGregPitch/polytools"
Issues = "https://github.com/DrGregPitch/polytools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polytools"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B905",  # zip(strict=) is 3.10+, kept optional for compatibility
    "C408",  # dict(a=1) reads better than {"a": 1} for matplotlib kwargs and
             # parameter bags that are later updated conditionally
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
